<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SketchMotion</title>
<style>
  :root {
    --ink: #1f2933; --paper: #fbf9f4; --accent: #ff6b4a; --accent-2: #2d7dd2;
    --line: #d9d2c5; --muted: #8a8273;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Comic Sans MS", "Segoe Print", system-ui, sans-serif;
    display: flex; min-height: 100vh; align-items: flex-start; justify-content: center;
  }
  .wrap { width: min(880px, 94vw); padding: 40px 0 80px; }
  h1 { font-size: 2.4rem; margin: 0 0 4px; letter-spacing: -0.5px; }
  .tag { color: var(--muted); margin: 0 0 28px; }
  .card {
    background: #fff; border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 22px; box-shadow: 6px 6px 0 rgba(31,41,51,0.12); margin-bottom: 22px;
  }
  label { display: block; font-weight: 700; margin: 14px 0 6px; }
  textarea, select, input[type=file] {
    width: 100%; font: inherit; padding: 10px 12px; border: 2px solid var(--ink);
    border-radius: 10px; background: var(--paper);
  }
  textarea { min-height: 84px; resize: vertical; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .row > div { flex: 1 1 200px; }
  .range-val { font-weight: 700; color: var(--accent-2); }
  button {
    margin-top: 20px; font: inherit; font-weight: 800; font-size: 1.1rem;
    background: var(--accent); color: #fff; border: 2.5px solid var(--ink);
    border-radius: 12px; padding: 12px 26px; cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink); transition: transform .05s;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  #status { margin-top: 16px; font-weight: 700; min-height: 1.4em; }
  .bar { height: 14px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--paper); margin-top: 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent-2); transition: width .3s; }
  video { width: 100%; border: 2.5px solid var(--ink); border-radius: 12px; margin-top: 18px; background: #000; }
  .err { color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>✎ SketchMotion</h1>
  <p class="tag">Prompt, picture, or video in. Hand-drawn sketch out.</p>

  <div class="card">
    <h1 style="font-size:1.4rem;margin:0 0 4px">✨ Create</h1>
    <p class="tag" style="margin:0 0 12px">Pick your options, then run. The agent routes it for you.</p>

    <label for="cprompt">Prompt <span style="font-weight:400;color:var(--muted)">(optional if you upload a file)</span></label>
    <textarea id="cprompt" placeholder="e.g. why morning routines boost productivity"></textarea>

    <label for="cfile">Picture or video <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input type="file" id="cfile" accept="image/*,video/*" />

    <div class="row">
      <div>
        <label for="cmode">Mode</label>
        <select id="cmode">
          <option value="auto">Auto (decide for me)</option>
          <option value="animate">Animate from prompt</option>
          <option value="stylize">Sketch my file</option>
        </select>
      </div>
      <div>
        <label for="coutput">Output</label>
        <select id="coutput">
          <option value="">Auto</option>
          <option value="video">Video</option>
          <option value="still">Still image</option>
        </select>
      </div>
      <div>
        <label for="cstyle">Sketch style</label>
        <select id="cstyle">
          <option value="auto">Auto</option>
          <option value="ink">Ink + color</option>
          <option value="pencil">Pencil (B/W)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="cduration">Duration (animate) — <span class="range-val" id="cdurval">15</span>s</label>
        <input type="range" id="cduration" min="5" max="60" value="15" style="width:100%" />
      </div>
      <div>
        <label for="caspect">Format</label>
        <select id="caspect">
          <option value="16:9">YouTube / Web (16:9)</option>
          <option value="9:16">Reels / Shorts (9:16)</option>
          <option value="1:1">Feed (1:1)</option>
        </select>
      </div>
    </div>
    <button id="cgo">Create →</button>
    <div id="cstatus"></div>
    <div class="bar" id="cbarwrap" style="display:none"><i id="cbar"></i></div>
    <video id="cplayer" controls style="display:none"></video>
    <img id="cimage" alt="sketch" style="display:none;width:100%;border:2.5px solid var(--ink);border-radius:12px;margin-top:18px" />
  </div>

  <p class="tag" style="margin:6px 0 14px;font-weight:700">— or use a direct pipeline —</p>

  <div class="card">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="e.g. celebrate a product launch with confetti and a trophy"></textarea>

    <label for="image">Reference image (optional)</label>
    <input type="file" id="image" accept="image/*" />

    <div class="row">
      <div>
        <label for="duration">Duration — <span class="range-val" id="durval">15</span>s</label>
        <input type="range" id="duration" min="5" max="60" value="15" style="width:100%" />
      </div>
      <div>
        <label for="aspect">Format</label>
        <select id="aspect">
          <option value="16:9">YouTube / Web (16:9)</option>
          <option value="9:16">Reels / Shorts / TikTok (9:16)</option>
          <option value="1:1">LinkedIn / Feed (1:1)</option>
        </select>
      </div>
    </div>

    <button id="go">Generate sketch →</button>
    <div id="status"></div>
    <div class="bar" id="barwrap" style="display:none"><i id="bar"></i></div>
    <video id="player" controls style="display:none"></video>
  </div>

  <div class="card">
    <h1 style="font-size:1.4rem;margin:0 0 4px">🎞️ Sketch a real video</h1>
    <p class="tag" style="margin:0 0 12px">Upload footage — the players become a hand-drawn sketch.</p>
    <div class="row">
      <div>
        <label for="svideo">Video file</label>
        <input type="file" id="svideo" accept="video/*" />
      </div>
      <div>
        <label for="sstyle">Look</label>
        <select id="sstyle">
          <option value="ink">Ink + flat color</option>
          <option value="pencil">Pencil (B/W)</option>
        </select>
      </div>
    </div>
    <button id="sgo">Sketch the video →</button>
    <div id="sstatus"></div>
    <div class="bar" id="sbarwrap" style="display:none"><i id="sbar"></i></div>
    <video id="splayer" controls style="display:none"></video>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
$("duration").addEventListener("input", () => $("durval").textContent = $("duration").value);

let polling = null;

async function poll(jobId) {
  try {
    const r = await fetch(`/jobs/${jobId}`);
    if (!r.ok) throw new Error(`status ${r.status}`);
    const j = await r.json();
    $("status").textContent = `Status: ${j.status} (${j.progress_pct}%)`;
    $("bar").style.width = `${j.progress_pct}%`;
    if (j.status === "done") {
      clearInterval(polling);
      const v = $("player");
      v.src = `/jobs/${jobId}/video`;
      v.style.display = "block";
      $("go").disabled = false;
    } else if (j.status === "failed") {
      clearInterval(polling);
      $("status").innerHTML = `<span class="err">Failed: ${j.error || "unknown error"}</span>`;
      $("go").disabled = false;
    }
  } catch (e) {
    clearInterval(polling);
    $("status").innerHTML = `<span class="err">Lost connection: ${e.message}</span>`;
    $("go").disabled = false;
  }
}

$("go").addEventListener("click", async () => {
  const prompt = $("prompt").value.trim();
  if (!prompt) { $("status").innerHTML = `<span class="err">Enter a prompt first.</span>`; return; }
  $("go").disabled = true;
  $("player").style.display = "none";
  $("barwrap").style.display = "block";
  $("bar").style.width = "0%";
  $("status").textContent = "Queuing…";

  const fd = new FormData();
  fd.append("prompt", prompt);
  fd.append("duration_s", $("duration").value);
  fd.append("aspect", $("aspect").value);
  fd.append("captions", "true");
  const img = $("image").files[0];
  if (img) fd.append("image", img);

  try {
    const r = await fetch("/generate", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || `status ${r.status}`);
    $("status").textContent = "Queued.";
    polling = setInterval(() => poll(j.job_id), 1000);
  } catch (e) {
    $("status").innerHTML = `<span class="err">${e.message}</span>`;
    $("go").disabled = false;
  }
});

// --- Sketch a real video ---
let spolling = null;
async function spoll(jobId) {
  try {
    const r = await fetch(`/jobs/${jobId}`);
    if (!r.ok) throw new Error(`status ${r.status}`);
    const j = await r.json();
    $("sstatus").textContent = `Status: ${j.status} (${j.progress_pct}%)`;
    $("sbar").style.width = `${j.progress_pct}%`;
    if (j.status === "done") {
      clearInterval(spolling);
      const v = $("splayer");
      v.src = `/jobs/${jobId}/video`;
      v.style.display = "block";
      $("sgo").disabled = false;
    } else if (j.status === "failed") {
      clearInterval(spolling);
      $("sstatus").innerHTML = `<span class="err">Failed: ${j.error || "unknown error"}</span>`;
      $("sgo").disabled = false;
    }
  } catch (e) {
    clearInterval(spolling);
    $("sstatus").innerHTML = `<span class="err">Lost connection: ${e.message}</span>`;
    $("sgo").disabled = false;
  }
}

// --- Unified Create ---
$("cduration").addEventListener("input", () => $("cdurval").textContent = $("cduration").value);
let cpolling = null;
async function cpoll(jobId, outputKind) {
  try {
    const r = await fetch(`/jobs/${jobId}`);
    if (!r.ok) throw new Error(`status ${r.status}`);
    const j = await r.json();
    $("cstatus").textContent = `Status: ${j.status} (${j.progress_pct}%)`;
    $("cbar").style.width = `${j.progress_pct}%`;
    if (j.status === "done") {
      clearInterval(cpolling);
      if (outputKind === "still") {
        const im = $("cimage"); im.src = `/jobs/${jobId}/image?t=${Date.now()}`; im.style.display = "block";
      } else {
        const v = $("cplayer"); v.src = `/jobs/${jobId}/video`; v.style.display = "block";
      }
      $("cgo").disabled = false;
    } else if (j.status === "failed") {
      clearInterval(cpolling);
      $("cstatus").innerHTML = `<span class="err">Failed: ${j.error || "unknown"}</span>`;
      $("cgo").disabled = false;
    }
  } catch (e) {
    clearInterval(cpolling);
    $("cstatus").innerHTML = `<span class="err">Lost connection: ${e.message}</span>`;
    $("cgo").disabled = false;
  }
}

$("cgo").addEventListener("click", async () => {
  const prompt = $("cprompt").value.trim();
  const file = $("cfile").files[0];
  if (!prompt && !file) { $("cstatus").innerHTML = `<span class="err">Add a prompt or a file.</span>`; return; }
  $("cgo").disabled = true;
  $("cplayer").style.display = "none"; $("cimage").style.display = "none";
  $("cbarwrap").style.display = "block"; $("cbar").style.width = "0%";
  $("cstatus").textContent = "Routing…";

  const fd = new FormData();
  fd.append("prompt", prompt);
  fd.append("mode", $("cmode").value);
  fd.append("output_kind", $("coutput").value);
  fd.append("style", $("cstyle").value);
  fd.append("duration_s", $("cduration").value);
  fd.append("aspect", $("caspect").value);
  if (file) fd.append("file", file);

  try {
    const r = await fetch("/create", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || `status ${r.status}`);
    $("cstatus").textContent = `Queued — ${j.route} → ${j.output_kind} (${j.style})`;
    cpolling = setInterval(() => cpoll(j.job_id, j.output_kind), 1500);
  } catch (e) {
    $("cstatus").innerHTML = `<span class="err">${e.message}</span>`;
    $("cgo").disabled = false;
  }
});

$("sgo").addEventListener("click", async () => {
  const file = $("svideo").files[0];
  if (!file) { $("sstatus").innerHTML = `<span class="err">Choose a video first.</span>`; return; }
  $("sgo").disabled = true;
  $("splayer").style.display = "none";
  $("sbarwrap").style.display = "block";
  $("sbar").style.width = "0%";
  $("sstatus").textContent = "Uploading…";

  const fd = new FormData();
  fd.append("style", $("sstyle").value);
  fd.append("video", file);
  try {
    const r = await fetch("/stylize", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || `status ${r.status}`);
    $("sstatus").textContent = "Queued…";
    spolling = setInterval(() => spoll(j.job_id), 1500);
  } catch (e) {
    $("sstatus").innerHTML = `<span class="err">${e.message}</span>`;
    $("sgo").disabled = false;
  }
});
</script>
</body>
</html>
